<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Identity Extractor | Pratyusha Pal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #141416;
            --text-main: #f4f4f5;
            --text-muted: #94949b;
            --accent: #3b82f6;
            --border-color: #27272a;
        }
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            color: #fff;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .tool-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
        }
        .input-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .input-field {
            flex: 1;
            min-width: 280px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            color: var(--text-main);
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
        }
        .input-field:focus { outline: none; border-color: var(--text-main); }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #e4e4e7; }
        .btn-back {
            display: inline-block;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .output-console {
            background: #09090b;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 6px;
            margin-top: 2rem;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a1a1aa;
            display: none;
            white-space: pre-wrap;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        a { color: var(--text-main); text-decoration: none; }
    </style>
</head>
<body>

<header>
    <h1>Tool 2: Brand Identity Extractor</h1>
</header>

<div class="container">
    <a href="projects.html" class="btn-back">&larr; Back to Tools Hub</a>

    <div class="tool-box">
        <h3>Website Metadata & Identity Audit Agent</h3>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Provide any brand website URL below to simulate an automated visual and textual scan, compiling a comprehensive brand guide document.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" class="input-field" placeholder="e.g., https://example-training.co.uk">
            <button onclick="runBrandExtractor()" class="btn">Extract Brand Document</button>
        </div>

        <div id="outputConsole" class="output-console"></div>
    </div>
</div>

<script>
function runBrandExtractor() {
    const url = document.getElementById('urlInput').value.trim();
    const consoleBox = document.getElementById('outputConsole');

    if (!url) {
        alert('Please enter a valid website URL.');
        return;
    }

    consoleBox.style.display = 'block';
    consoleBox.innerHTML = `[Connecting to Extraction Agent...] \nAnalyzing DOM structure and metadata for: "${url}"...\nScraping UI color schemes and typography classes...\n\n# Brand Identity Profile Document\n--------------------------------------------------\n- **Target Entity:** ${url}\n- **Detected Tone & Voice:** Professional, authoritative, and instructional.\n- **Extracted Color Palette:**\n  1. Primary Dark: #0f0f0f (Dominant Background)\n  2. Accent Tone: #3b82f6 (Interactive CTAs)\n  3. Neutral Text: #f4f4f5 (High contrast body font)\n- **Core Business Positioning:** Specialized vocational training and compliance certification provider.\n- **Key Product Offerings:** Regulated safety courses, high-volume candidate portfolio auditing, and automated tracking systems.\n\n[Status: Structured brand document compiled successfully.]`;
}
</script>

<footer>
    <p>&copy; 2026 Pratyusha Pal. All rights reserved.</p>
</footer>

</body>
</html>
