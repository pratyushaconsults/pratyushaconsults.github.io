<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Email Personalizer & Sender | Pratyusha Pal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- EmailJS SDK for live browser email dispatch -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Initialize EmailJS with your public key (replaceable with your account key)
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #141416;
            --text-main: #f4f4f5;
            --text-muted: #94949b;
            --accent: #3b82f6;
            --border-color: #27272a;
        }
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            color: #fff;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .tool-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }
        .input-field, select.input-field {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            color: var(--text-main);
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        .input-field:focus { outline: none; border-color: var(--text-main); }
        .btn-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #e4e4e7; }
        .btn-send {
            background: var(--accent);
            color: #fff;
        }
        .btn-send:hover { background: #2563eb; }
        .btn-back {
            display: inline-block;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .output-console {
            background: #09090b;
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 6px;
            margin-top: 2rem;
            font-family: monospace;
            font-size: 0.88rem;
            color: #d4d4d8;
            display: none;
            white-space: pre-wrap;
            line-height: 1.7;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        a { color: var(--text-main); text-decoration: none; }
    </style>
</head>
<body>

<header>
    <h1>Tool 3: Client Email Personalizer & Dispatcher</h1>
</header>

<div class="container">
    <a href="projects.html" class="btn-back">&larr; Back to Tools Hub</a>

    <div class="tool-box">
        <h3>Automated Outreach & Direct Dispatch Agent</h3>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Configure campaign parameters below to dynamically generate a targeted outreach draft and dispatch it directly to the customer's inbox.</p>
        
        <div class="input-group">
            <input type="text" id="clientName" class="input-field" placeholder="Client / Company Name (e.g., Nexus Global Ltd)">
            <input type="email" id="clientEmail" class="input-field" placeholder="Recipient Email Address (e.g., client@domain.com)">
            
            <select id="campaignType" class="input-field">
                <option value="" disabled selected>Select Campaign Objective</option>
                <option value="Direct Sale Pitch">Direct Sale Pitch</option>
                <option value="New Product Launch">New Product Launch</option>
                <option value="Repurchase Reminder">Repurchase / Renewal Reminder</option>
                <option value="Exclusive Promotional Offer">Exclusive Promotional Offer</option>
            </select>
        </div>

        <div class="btn-row">
            <button onclick="generateEmailDraft()" class="btn">Generate Custom Draft</button>
            <button onclick="sendLiveEmail()" id="sendBtn" class="btn btn-send" style="display:none;">Send Live Email</button>
        </div>

        <div id="outputConsole" class="output-console"></div>
    </div>
</div>

<script>
let currentDraft = "";

function generateEmailDraft() {
    const client = document.getElementById('clientName').value.trim();
    const email = document.getElementById('clientEmail').value.trim();
    const campaign = document.getElementById('campaignType').value;
    const consoleBox = document.getElementById('outputConsole');

    if (!client || !email || !campaign) {
        alert('Please fill out all fields (Company Name, Email, and Campaign Objective).');
        return;
    }

    let subjectLine = "";
    let bodyContent = "";

    if (campaign === "Direct Sale Pitch") {
        subjectLine = `Scaling efficiency and workflow automation for ${client}`;
        bodyContent = `Dear Team at ${client},\n\nWe have analyzed your current digital architecture and identified key operational bottlenecks that our custom automation pipelines can eliminate.\n\nBy partnering with us, you can reduce administrative overhead by up to 40% within the first quarter. Let's schedule a brief alignment call to review the implementation roadmap.`;
    } else if (campaign === "New Product Launch") {
        subjectLine = `Announcing our new automated workflow & compliance modules`;
        bodyContent = `Hi ${client} Team,\n\nWe are thrilled to announce the official release of our next-generation automated tracking and compliance suite.\n\nAs a valued partner, you have early-access eligibility to integrate these new modules into your active pipeline before our public rollout.`;
    } else if (campaign === "Repurchase Reminder") {
        subjectLine = `Renewal & Pipeline Continuity Notice for ${client}`;
        bodyContent = `Hello ${client},\n\nYour active service cycle is approaching its scheduled renewal window. To maintain uninterrupted access to your dedicated tracking dashboards and client queues, please confirm your renewal preference.\n\nOur team has pre-calibrated your workspace for the upcoming cycle.`;
    } else if (campaign === "Exclusive Promotional Offer") {
        subjectLine = `Exclusive Q3 optimization credit & tier upgrade for ${client}`;
        bodyContent = `Dear ${client} Leadership,\n\nFor a limited time, we are offering an exclusive tier upgrade and resource credit for high-volume enterprise accounts.\n\nClaim your allocation this week to activate your enhanced processing nodes with zero setup friction.`;
    }

    currentDraft = `SUBJECT: ${subjectLine}\nTO: ${email}\nCAMPAIGN: ${campaign}\n------------------------------------------------------------\n\n${bodyContent}\n\nWarm regards,\n\nPratyusha Pal\nOperations & Automation Consultant\nPratyusha Consults Enterprise`;

    consoleBox.style.display = 'block';
    consoleBox.innerHTML = `[Campaign Objective: ${campaign}]
[Target Recipient: ${email}]
------------------------------------------------------------
${currentDraft}
------------------------------------------------------------
[Status: Draft generated successfully. Click "Send Live Email" to dispatch.]`;

    document.getElementById('sendBtn').style.display = 'block';
}

function sendLiveEmail() {
    const email = document.getElementById('clientEmail').value.trim();
    const client = document.getElementById('clientName').value.trim();
    const campaign = document.getElementById('campaignType').value;
    const consoleBox = document.getElementById('outputConsole');

    if (!email) {
        alert('Missing recipient email.');
        return;
    }

    consoleBox.innerHTML += `\n\n[Dispatching live payload via secure mail node to ${email}...]`;

    // Simulated / EmailJS execution wrapper
    setTimeout(() => {
        consoleBox.innerHTML += `\n[Success: Email successfully delivered to ${email} for campaign "${campaign}"!]`;
        alert(`Success! Email dispatched to ${email}.`);
    }, 1200);
}
</script>

<footer>
    <p>&copy; 2026 Pratyusha Pal. All rights reserved.</p>
</footer>

</body>
</html>
