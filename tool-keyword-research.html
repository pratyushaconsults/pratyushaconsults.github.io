<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automate Keyword Research | Pratyusha Pal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #141416;
            --text-main: #f4f4f5;
            --text-muted: #94949b;
            --accent: #3b82f6;
            --border-color: #27272a;
        }
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            color: #fff;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .tool-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
        }
        .input-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .input-field {
            flex: 1;
            min-width: 280px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            color: var(--text-main);
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
        }
        .input-field:focus { outline: none; border-color: var(--text-main); }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #e4e4e7; }
        .btn-back {
            display: inline-block;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .output-console {
            background: #09090b;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 6px;
            margin-top: 2rem;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a1a1aa;
            display: none;
            white-space: pre-wrap;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        a { color: var(--text-main); text-decoration: none; }
    </style>
</head>
<body>

<header>
    <h1>Tool 1: Automate Keyword Research</h1>
</header>

<div class="container">
    <a href="projects.html" class="btn-back">&larr; Back to Tools Hub</a>

    <div class="tool-box">
        <h3>AI Keyword & Competitor Extraction Agent</h3>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem;">Type any subject below to simulate a dynamic search sweep, analyze unique competitor ranking URLs, and output a structured Markdown (.md) research blueprint.</p>
        
        <div class="input-group">
            <input type="text" id="topicInput" class="input-field" placeholder="e.g., Python Data Analysis Course">
            <button onclick="runKeywordTool()" class="btn">Generate Research Brief</button>
        </div>

        <div id="outputConsole" class="output-console"></div>
    </div>
</div>

<script>
function runKeywordTool() {
    const rawTopic = document.getElementById('topicInput').value.trim();
    const consoleBox = document.getElementById('outputConsole');

    if (!rawTopic) {
        alert('Please enter a target topic.');
        return;
    }

    // Dynamic formatting based on input
    const formattedSlug = rawTopic.toLowerCase().replace(/[^a-z0-9]/g, '-');
    const randomVol1 = Math.floor(Math.random() * 2500) + 400;
    const randomVol2 = Math.floor(Math.random() * 900) + 150;
    const kdOptions = ['Low', 'Easy', 'Moderate', 'Favorable'];
    const randomKd = kdOptions[Math.floor(Math.random() * kdOptions.length)];

    const domains = [
        `https://www.top-accreditations.co.uk/guides/${formattedSlug}`,
        `https://www.industry-standards.org/certifications/${formattedSlug}`,
        `https://www.professional-hub.io/resources/${formattedSlug}`,
        `https://www.global-learning-portal.net/courses/${formattedSlug}`
    ];
    
    // Pick two unique pseudo-random domains based on string length
    const d1 = domains[rawTopic.length % domains.length];
    const d2 = domains[(rawTopic.length + 1) % domains.length];

    consoleBox.style.display = 'block';
    consoleBox.innerHTML = `[Connecting to Dynamic Agent Pipeline...] \nScanning search grid for: "${rawTopic}"...\nExtracting top ranking competitors...\n\n# Markdown Research Brief: ${rawTopic}\n--------------------------------------------------\n- **Top Competitor 1:** ${d1}\n- **Top Competitor 2:** ${d2}\n\n### High-Intent Keyword Clusters:\n1. "${rawTopic} online certification" (Search Vol: ${randomVol1}, KD: ${randomKd})\n2. "Best fast-track ${rawTopic}" (Search Vol: ${randomVol2}, KD: Easy)\n\n### Recommended Content Structure:\n- **H1:** Ultimate Masterclass & Guide to ${rawTopic}\n- **H2:** Core Prerequisites & Practical Execution Framework\n- **H3:** Step-by-Step Evaluation & Certification Workflow\n\n[Status: Unique research file compiled successfully & token-optimized.]`;
}
</script>

<footer>
    <p>&copy; 2026 Pratyusha Pal. All rights reserved.</p>
</footer>

</body>
</html>
